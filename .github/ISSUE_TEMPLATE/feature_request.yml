name: Feature request
description: Suggest an idea or improvement
labels: [enhancement]
body:
  - type: markdown
    attributes:
      value: Check [ROADMAP.md](../blob/main/ROADMAP.md) first — it may already be planned.
  - type: textarea
    id: problem
    attributes:
      label: What problem would this solve?
      description: Describe the workflow in your vulnerability management process.
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: Proposed solution
