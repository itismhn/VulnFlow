# Production-style stack. From the repo root:
#   make docker-env        # creates .env with random secrets (or copy .env.example)
#   make docker-up         # build and start
#   make docker-admin      # create the first admin account
# Without make, always pass --env-file so ${POSTGRES_PASSWORD} resolves:
#   docker compose -f deploy/docker-compose.yml --env-file .env <command>
name: report-manager

x-backend: &backend
  build: ../backend
  image: report-manager-api:latest
  env_file: ../.env
  # Derived from POSTGRES_PASSWORD so the two can never drift apart
  environment:
    RM_DATABASE_URL: postgresql+psycopg://report_manager:${POSTGRES_PASSWORD}@db:5432/report_manager
    RM_REDIS_URL: redis://redis:6379/0
  restart: unless-stopped
  volumes:
    - storage:/data
  depends_on:
    db:
      condition: service_healthy
    redis:
      condition: service_healthy

services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: report_manager
      POSTGRES_USER: report_manager
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U report_manager -d report_manager"]
      interval: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      retries: 10

  migrate:
    <<: *backend
    restart: "no"
    command: ["alembic", "upgrade", "head"]

  api:
    <<: *backend
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health')"]
      interval: 15s
      retries: 5

  worker:
    # Runs the scheduler too (risk-acceptance expiry, audit retention): keep a single replica
    <<: *backend
    command: ["celery", "-A", "app.workers.celery_app", "worker", "--beat", "--schedule", "/tmp/celerybeat-schedule", "--loglevel=info", "--pool", "threads", "--concurrency", "4"]
    depends_on:
      migrate:
        condition: service_completed_successfully

  web:
    build: ../frontend
    image: report-manager-web:latest
    restart: unless-stopped
    ports:
      - "${HTTP_PORT:-8080}:8080"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:8080/"]
      interval: 15s
      retries: 5

volumes:
  pgdata:
  redisdata:
  storage:
