# Production-style stack. From the repo root:
#   cp .env.example .env   # then edit secrets
#   docker compose -f deploy/docker-compose.yml --env-file .env up -d --build
#   docker compose -f deploy/docker-compose.yml exec api python -m app.cli create-admin
name: report-manager

x-backend: &backend
  build: ../backend
  image: report-manager-api:latest
  env_file: ../.env
  restart: unless-stopped
  volumes:
    - storage:/data
  depends_on:
    db:
      condition: service_healthy
    redis:
      condition: service_healthy

services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: report_manager
      POSTGRES_USER: report_manager
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U report_manager -d report_manager"]
      interval: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      retries: 10

  migrate:
    <<: *backend
    restart: "no"
    command: ["alembic", "upgrade", "head"]

  api:
    <<: *backend
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health')"]
      interval: 15s
      retries: 5

  worker:
    # Runs the scheduler too (risk-acceptance expiry, audit retention): keep a single replica
    <<: *backend
    command: ["celery", "-A", "app.workers.celery_app", "worker", "--beat", "--schedule", "/tmp/celerybeat-schedule", "--loglevel=info", "--pool", "threads", "--concurrency", "4"]
    depends_on:
      migrate:
        condition: service_completed_successfully

  web:
    build: ../frontend
    image: report-manager-web:latest
    restart: unless-stopped
    ports:
      - "${HTTP_PORT:-8080}:8080"
    depends_on:
      api:
        condition: service_healthy

volumes:
  pgdata:
  redisdata:
  storage:
